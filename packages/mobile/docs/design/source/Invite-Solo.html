<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="pidro-ds-v2.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&amp;family=Nunito:wght@500;600;700;800;900&amp;display=swap">
<style>
body{margin:0;font-family:"Nunito",sans-serif;color:#ffffff;background:#07264c}
a{color:#8beaff}a:hover{color:#c4f4ff}
a:focus-visible,button:focus-visible{outline:2px solid #FFD447;outline-offset:2px}
:where(button.wood,button.glass){padding:0;border:none;background:none;font:inherit;cursor:pointer}
.is-card{box-sizing:border-box;width:58px;height:84px;border-radius:8px;background:#f6f1e6;border:1px solid #d9cfb8;display:flex;flex-direction:column;align-items:flex-start;padding:5px 6px;font-family:"Bree Serif",serif;font-size:18px;line-height:20px;box-shadow:0px 4px 10px rgba(0,0,0,0.35)}
.is-seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px}
.is-nm{margin:0;font-weight:800;font-size:13px;line-height:16px;color:rgba(239,249,255,0.9)}
.is-ttl{margin:0;font-weight:800;font-size:17px;line-height:22px;color:#ffffff}
.is-meta{margin:0;font-weight:700;font-size:13px;line-height:18px;color:rgba(239,249,255,0.78)}
</style>
</head><body>

<main class="felt" style="width: 390px; height: 844px; box-sizing: border-box; position: relative">

<div aria-hidden="true" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; opacity: 0.55">
<div class="is-seat" style="left: 159px; top: 210px"><span class="ring glass-ring" style="width: 56px; height: 56px; padding: 3px"><span class="face-initial bot"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="14" height="11" rx="3"></rect><path d="M12 8V5.5"></path><circle cx="12" cy="4.2" r="1.2"></circle><path d="M9.5 12.5v2M14.5 12.5v2"></path></svg></span></span><p class="is-nm">Antti</p></div>
<div class="is-seat" style="left: 20px; top: 380px"><span class="ring glass-ring" style="width: 56px; height: 56px; padding: 3px"><span class="face-initial bot"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="14" height="11" rx="3"></rect><path d="M12 8V5.5"></path><circle cx="12" cy="4.2" r="1.2"></circle><path d="M9.5 12.5v2M14.5 12.5v2"></path></svg></span></span><p class="is-nm">Jocke</p></div>
<div class="is-seat" style="left: 314px; top: 380px"><span class="ring glass-ring" style="width: 56px; height: 56px; padding: 3px"><span class="face-initial bot"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="14" height="11" rx="3"></rect><path d="M12 8V5.5"></path><circle cx="12" cy="4.2" r="1.2"></circle><path d="M9.5 12.5v2M14.5 12.5v2"></path></svg></span></span><p class="is-nm">Marcel</p></div>
<div style="position: absolute; left: 20px; right: 20px; bottom: 40px; display: flex; justify-content: center; gap: 0">
<span class="is-card" style="color: #b3261e; margin-right: -14px">A<br>♥</span>
<span class="is-card" style="color: #b3261e; margin-right: -14px">K<br>♥</span>
<span class="is-card" style="color: #1a1a2e; margin-right: -14px">10<br>♠</span>
<span class="is-card" style="color: #b3261e; margin-right: -14px">5<br>♦</span>
<span class="is-card" style="color: #b3261e; margin-right: -14px">5<br>♥</span>
<span class="is-card" style="color: #1a1a2e">2<br>♣</span>
</div>
</div>

<div role="alert" style="position: absolute; left: 16px; right: 16px; top: 59px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 16px; background: #0b2c4f; border: 1.5px solid #E2AF45; box-shadow: 0px 12px 28px rgba(0, 0, 0, 0.55)">
<div style="display: flex; align-items: center; gap: 12px">
<span class="ring" style="width: 44px; height: 44px; padding: 2.5px; flex-shrink: 0"><span class="face-initial" style="font-size: 19px">B</span></span>
<div style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
<p class="is-ttl">Bertil is holding a seat for you</p>
<p class="is-meta">Finnish · as Bertil’s partner</p>
</div>
</div>
<div style="display: flex; gap: 8px">
<button type="button" class="wood" style="flex: 1 1 0; height: 48px"><span class="face" style="font-size: 17px">Join Bertil</span></button>
<button type="button" class="glass" style="flex: 1 1 0; height: 48px"><span class="face" style="font-size: 16px">Not now</span></button>
</div>
<p class="is-meta" style="text-align: center">Joining ends your game with the bots.</p>
</div>
</main>

</body></html>
