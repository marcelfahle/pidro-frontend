<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="pidro-ds-v2.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&amp;family=Nunito:wght@500;600;700;800;900&amp;display=swap">
<style>
body{margin:0;font-family:"Nunito",sans-serif;color:#ffffff;background:#07264c}
a{color:#8beaff}a:hover{color:#c4f4ff}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #FFD447;outline-offset:2px}
.seg{display:flex;gap:4px;flex-grow:1;min-width:0}
.segb{box-sizing:border-box;flex:1 1 0;min-width:0;height:44px;padding:0 4px;border-radius:9px;border:1px solid rgba(184,225,246,0.3);background:rgba(7,45,82,0.86);color:rgba(239,249,255,0.85);font-family:"Nunito",sans-serif;font-weight:800;font-size:13px;line-height:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-decoration:none;cursor:pointer;text-align:center;transition:background 150ms ease-out,border-color 150ms ease-out}
.segb:hover{background:rgba(18,74,119,0.9)}
.segb.on{border:2px solid #E2AF45;background:rgba(107,73,11,0.5);color:#FFD447}
.segb .sub{font-weight:700;font-size:11px;line-height:14px;color:rgba(239,249,255,0.7)}
.segb.on .sub{color:rgba(255,224,150,0.85)}
.seatrow{display:flex;align-items:center;gap:10px;min-height:44px}
.rule{height:1px;background:rgba(184,225,246,0.22);flex-grow:1}
.req{position:absolute;left:50%;transform:translateX(-50%);bottom:-7px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;min-width:26px;height:16px;padding:0 5px;border-radius:999px;background:#0A2340;border:1.5px solid #86CFEE;font-family:"Nunito",sans-serif;font-weight:900;font-size:9px;color:#ffffff;font-variant-numeric:tabular-nums;white-space:nowrap}
</style>
</head><body>

<main class="felt" style="width: 390px; height: 844px; box-sizing: border-box; padding: 59px 20px 34px; display: flex; flex-direction: column; gap: 14px">

<header style="display: flex; align-items: center; gap: 12px">
<a class="glass" href="Lobby-List.dc.html" aria-label="Back" style="width: 44px; height: 44px"><span class="face"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#CFEFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></span></a>
</header>

<div class="seg" role="radiogroup" aria-label="Rules" style="gap: 8px; flex-grow: 0">

<button type="button" role="radio" aria-checked="true" class="segb on" onclick="() =&gt; this.setState({ rules: r.id })" style="height: 56px; font-size: 15px"><span>Finnish</span><span class="sub">Trumps only · bids from 6</span></button>

<button type="button" role="radio" aria-checked="false" class="segb" onclick="() =&gt; this.setState({ rules: r.id })" style="height: 56px; font-size: 15px"><span>Louisiana</span><span class="sub">Off-suit plays · bids from 7</span></button>

</div>

<section class="window" aria-label="Seats" style="padding: 12px; display: flex; flex-direction: column; gap: 10px">

<div class="seatrow">
<span class="ring" style="width: 40px; height: 40px; padding: 2.5px; flex-shrink: 0"><span class="face-initial" style="font-size: 17px">B</span></span>
<span style="display: flex; flex-direction: column; gap: 1px; width: 76px; flex-shrink: 0"><span class="label" style="font-size: 14px">You</span><span class="meta" style="color: #FFD447">Host</span></span>
</div>


<div style="display: flex; flex-direction: column; gap: 8px">
<div class="seatrow">
<span style="position: relative; width: 40px; height: 40px; flex-shrink: 0" aria-hidden="true"><span class="chair-open" style="width: 40px; height: 40px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 6v12M6 12h12"></path></svg></span></span>


<span style="display: flex; flex-direction: column; gap: 1px; width: 76px; flex-shrink: 0"><span class="label" style="font-size: 14px">Partner</span><span class="meta" style="color: #8beaff"></span></span>
<div class="seg" role="radiogroup" aria-label="Who sits across from you">

<button type="button" role="radio" aria-checked="true" class="segb on" onclick="() =&gt; this.setState({ asking: key })">Open</button>


<button type="button" role="radio" aria-checked="false" class="segb" onclick="() =&gt; this.setState({ seats: Object.assign({}, s.seats, { [key]: o.id }), asking: null })">Bot</button>



<a class="segb" href="Create-Seat.dc.html">Friend</a>

</div>
</div>
</div>


<div aria-hidden="true" style="display: flex; align-items: center; gap: 12px"><span class="rule"></span><span class="display" style="font-size: 18px; line-height: 22px">vs</span><span class="rule"></span></div>


<div style="display: flex; flex-direction: column; gap: 8px">
<div class="seatrow">
<span style="position: relative; width: 40px; height: 40px; flex-shrink: 0" aria-hidden="true"><span class="chair-open" style="width: 40px; height: 40px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 6v12M6 12h12"></path></svg></span><span class="req">100+</span></span>


<span style="display: flex; flex-direction: column; gap: 1px; width: 76px; flex-shrink: 0"><span class="label" style="font-size: 14px">Opponent</span><span class="meta" style="color: #8beaff"></span></span>
<div class="seg" role="radiogroup" aria-label="Who sits in the first opponent seat">

<button type="button" role="radio" aria-checked="true" class="segb on" onclick="() =&gt; this.setState({ asking: key })">Open</button>


<button type="button" role="radio" aria-checked="false" class="segb" onclick="() =&gt; this.setState({ seats: Object.assign({}, s.seats, { [key]: o.id }), asking: null })">Bot</button>



<a class="segb" href="Create-Seat.dc.html">Friend</a>

</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div class="seatrow">

<span class="ring glass-ring" style="width: 40px; height: 40px; padding: 2.5px; flex-shrink: 0" aria-hidden="true"><span class="face-initial bot"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="14" height="11" rx="3"></rect><path d="M12 8V5.5"></path><circle cx="12" cy="4.2" r="1.2"></circle><path d="M9.5 12.5v2M14.5 12.5v2"></path></svg></span></span>

<span style="display: flex; flex-direction: column; gap: 1px; width: 76px; flex-shrink: 0"><span class="label" style="font-size: 14px">Opponent</span><span class="meta" style="color: #8beaff"></span></span>
<div class="seg" role="radiogroup" aria-label="Who sits in the second opponent seat">

<button type="button" role="radio" aria-checked="false" class="segb" onclick="() =&gt; this.setState({ asking: key })">Open</button>


<button type="button" role="radio" aria-checked="true" class="segb on" onclick="() =&gt; this.setState({ seats: Object.assign({}, s.seats, { [key]: o.id }), asking: null })">Bot</button>



<a class="segb" href="Create-Seat.dc.html">Friend</a>

</div>
</div>
</div>


</section>

<span style="flex-grow: 1"></span>

<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<a class="wood" href="Table-Seats.dc.html" style="width: 350px; height: 62px"><span class="face" style="font-size: 23px; letter-spacing: 0.5px">Open the table</span></a>
<p class="meta" style="text-align: center">2 open seats are listed for everyone.</p>
</div>
</main>

</body></html>
