<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="pidro-ds-v2.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&amp;family=Nunito:wght@500;600;700;800;900&amp;display=swap">
<style>
body{margin:0;font-family:"Nunito",sans-serif;color:#ffffff;background:#07264c}
a{color:#8beaff}a:hover{color:#c4f4ff}
a:focus-visible,button:focus-visible{outline:2px solid #FFD447;outline-offset:2px}
:where(button.glass,button.line){padding:0;border:none;background:none;font:inherit;cursor:pointer}
.bgrow{box-sizing:border-box;display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 10px;border-radius:12px;background:rgba(18,74,119,0.58);border:1px solid rgba(184,225,246,0.22)}
.bgnm{font-weight:800;font-size:16px}
.line{box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 6px;color:#ffffff;font-weight:800;font-size:16px;text-align:left;text-decoration:none;border-radius:10px}
.line:hover{background:rgba(139,234,255,0.1)}
.line.warn{color:#ffb4b9}
.sep{height:1px;background:rgba(184,225,246,0.18)}
.ttl{margin:0;font-weight:800;font-size:19px;line-height:25px;color:#ffffff}
.body{font-weight:600;font-size:16px;line-height:23px;color:rgba(239,249,255,0.88);margin:0}
.hint{font-weight:700;font-size:14px;line-height:19px;color:rgba(239,249,255,0.75);margin:0;text-align:center}
</style>
</head><body>

<main class="felt" style="width: 390px; height: 844px; box-sizing: border-box">

<div aria-hidden="true" style="position: absolute; left: 16px; right: 16px; top: 59px; display: flex; flex-direction: column; gap: 18px">
<div style="padding: 0 4px"><p class="display" style="font-size: 28px; line-height: 34px">Friends</p><p class="meta">7 friends · 3 playing now</p></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<p class="eyebrow" style="padding: 0 4px">Playing now</p>
<div class="bgrow"><span class="ring" style="width: 44px; height: 44px; padding: 2.5px"><span class="face-initial" style="font-size: 19px">N</span></span><span class="bgnm">Nora</span></div>
<div class="bgrow"><span class="ring glass-ring" style="width: 44px; height: 44px; padding: 2.5px"><span class="face-initial" style="font-size: 19px">K</span></span><span class="bgnm">Kalle</span></div>
<div class="bgrow"><span class="ring" style="width: 44px; height: 44px; padding: 2.5px"><span class="face-initial" style="font-size: 19px">M</span></span><span class="bgnm">Maija</span></div>
</div>
</div>
<div class="scrim"></div>

<section class="sheet" role="dialog" aria-label="Nora" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 20px 34px; display: flex; flex-direction: column; gap: 16px">
<span class="grabber" style="align-self: center"></span>

<div style="display: flex; align-items: center; gap: 14px; padding: 4px 4px 14px">
<span style="position: relative; width: 64px; height: 64px; flex-shrink: 0">
<span class="ring" style="width: 64px; height: 64px; padding: 3px"><span class="face-initial" style="font-size: 28px">N</span></span>
<span class="lvl" style="bottom: -9px; min-width: 26px; height: 18px; padding: 0 5px; font-size: 10px">31</span>
</span>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<h2 class="display" style="font-size: 26px; line-height: 32px">Nora</h2>
<p class="meta" style="font-size: 14px; color: #FFD447">At a table · partner seat free</p>
</div>
</div>



<div style="display: flex; flex-direction: column; gap: 10px; padding-bottom: 6px">
<a class="wood" href="#" style="width: 100%; height: 52px"><span class="face" style="font-size: 19px">Join Nora’s table</span></a>
<p class="hint">You’ll play as Nora’s partner.</p>
</div>

<div style="display: flex; flex-direction: column">
<a class="line" href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8beaff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c.8-4 4-6.5 8-6.5s7.2 2.5 8 6.5"></path></svg><span style="flex: 1">See full profile</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(184,225,246,0.7)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></a>
<span class="sep"></span>
<button type="button" class="line"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#CFEFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="8" r="4"></circle><path d="M2.5 20.5c.7-3.6 3.6-6 7.5-6 1.6 0 3 .4 4.2 1.1"></path><path d="M16 17.5h6"></path></svg>Remove from friends</button>
<span class="sep"></span>
<button type="button" class="line warn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffb4b9" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M6 6l12 12"></path></svg>Block Nora</button>
</div>







</section>
</main>

</body></html>
