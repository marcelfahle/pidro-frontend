<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="pidro-ds-v2.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&amp;family=Nunito:wght@500;600;700;800;900&amp;display=swap">
<style>
body{margin:0;font-family:"Nunito",sans-serif;color:#ffffff;background:#07264c}
a{color:#8beaff}a:hover{color:#c4f4ff}
.rays{position:absolute;left:-235px;top:-215px;width:860px;height:860px;border-radius:999px;background:repeating-conic-gradient(from 0deg,rgba(255,212,71,0.17) 0deg 5deg,rgba(255,212,71,0) 5deg 15deg);-webkit-mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,0.6) 30%,transparent 62%);mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,0.6) 30%,transparent 62%)}
.spot{position:absolute;left:15px;top:20px;width:360px;height:360px;border-radius:999px;background:radial-gradient(circle,rgba(255,226,140,0.55) 0%,rgba(255,212,71,0.18) 40%,rgba(255,212,71,0) 70%)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(2,14,28,0) 30%,rgba(2,14,28,0.72) 100%)}
.tcard{position:absolute;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;border-radius:10px;background:#fbfbf7;border:1px solid rgba(0,0,0,0.25);font-family:"Bree Serif",serif;color:#c3172f;line-height:1;overflow:hidden}
.tcard.hero{box-shadow:0px 0px 0px 3px #FFD447,0px 0px 40px rgba(255,212,71,0.85),0px 18px 36px rgba(0,0,0,0.55)}
.tcard.side{box-shadow:0px 8px 18px rgba(0,0,0,0.5)}
.sheen{position:absolute;top:-20%;left:0;width:60%;height:140%;background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,250,220,0.85) 45%,rgba(255,215,120,0.5) 55%,rgba(255,255,255,0) 100%);mix-blend-mode:screen;transform:translateX(-160%) skewX(-12deg)}
.plaque{position:absolute;box-sizing:border-box;display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:#0A2340;border:1.5px solid #E2AF45;box-shadow:0px 4px 12px rgba(0,0,0,0.5);font-family:"Nunito",sans-serif;font-weight:900;font-size:13px;color:#FFD447;white-space:nowrap}
.big62{font-family:"Bree Serif",serif;font-size:104px;line-height:96px;margin:0;background:linear-gradient(180deg,#FFF6CF 0%,#FFD447 38%,#E2AF45 62%,#9C6A1A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0px 3px 0px #4E2509) drop-shadow(0px 0px 18px rgba(255,212,71,0.55))}
.chip{box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 8px;border-radius:999px;background:rgba(7,45,82,0.9);border:1px solid rgba(226,175,69,0.75);font-family:"Nunito",sans-serif;font-weight:800;font-size:13px;color:#ffffff;white-space:nowrap}
.cf{position:absolute;top:-30px;font-family:"Bree Serif",serif;line-height:1;pointer-events:none}
.cf.card{width:9px;height:13px;border-radius:2px;background:#fbfbf7;box-shadow:0px 1px 2px rgba(0,0,0,0.4)}
.cf.gold{color:#FFD447}.cf.white{color:#ffffff}.cf.coral{color:#ff8a91}.cf.cyan{color:#8beaff}
.rm{display:flex;align-items:center;justify-content:center;gap:10px}
.rm .who{display:flex;gap:6px}
.rm .who>span{position:relative}
.rm .wait{filter:grayscale(1) brightness(0.6)}
.rm .ok{position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:999px;background:#92e6b2;box-shadow:0px 0px 0px 2px #0A2340;display:flex;align-items:center;justify-content:center}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes heroIn{0%{opacity:0;transform:translateY(120px) rotate(-30deg) scale(0.6)}55%{opacity:1;transform:translateY(-10px) rotate(-3deg) scale(1.08)}100%{opacity:1;transform:rotate(-6deg)}}
@keyframes sideL{0%{opacity:0;transform:rotate(0deg)}100%{opacity:1;transform:rotate(-20deg)}}
@keyframes sideR{0%{opacity:0;transform:rotate(0deg)}100%{opacity:1;transform:rotate(10deg)}}
@keyframes sweep{0%,55%{transform:translateX(-160%) skewX(-12deg)}100%{transform:translateX(260%) skewX(-12deg)}}
@keyframes slam{0%{opacity:0;transform:scale(2.4)}55%{opacity:1;transform:scale(0.92)}75%{transform:scale(1.04)}100%{opacity:1;transform:none}}
@keyframes up{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:none}}
@keyframes draw{0%{stroke-dashoffset:100}100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.4)}100%{opacity:1;transform:none}}
@keyframes fall{0%{transform:translateY(0) rotate(0deg)}100%{transform:translateY(900px) rotate(540deg)}}
@keyframes fill{0%{width:48%}100%{width:52%}}
@keyframes breathe{0%,100%{box-shadow:0px 8px 16px rgba(0,0,0,0.5),0px 0px 0px rgba(255,212,71,0)}50%{box-shadow:0px 8px 16px rgba(0,0,0,0.5),0px 0px 26px rgba(255,212,71,0.55)}}
.a-spin{animation:spin 60s linear infinite}
.a-hero{animation:heroIn 700ms cubic-bezier(.2,1.1,.3,1) 150ms both}
.a-sideL{animation:sideL 500ms cubic-bezier(.2,1.2,.4,1) 600ms both}
.a-sideR{animation:sideR 500ms cubic-bezier(.2,1.2,.4,1) 650ms both}
.a-sweep{animation:sweep 3.4s ease-in-out 1.2s infinite}
.a-slam{animation:slam 520ms cubic-bezier(.2,1.3,.4,1) 1050ms both}
.a-up{animation:up 380ms ease-out both}
.a-draw{stroke-dasharray:100;animation:draw 1100ms cubic-bezier(.5,0,.2,1) 1500ms both}
.a-pop{transform-box:fill-box;transform-origin:center;animation:pop 360ms cubic-bezier(.2,1.5,.4,1) 2550ms both}
.a-fall{animation:fall linear infinite}
.a-fill{animation:fill 900ms ease-out 2600ms both}
.a-breathe{animation:breathe 2.4s ease-in-out 3.2s infinite}
@media (prefers-reduced-motion: reduce){.a-spin,.a-hero,.a-sideL,.a-sideR,.a-sweep,.a-slam,.a-up,.a-draw,.a-pop,.a-fall,.a-fill,.a-breathe{animation:none}.cf{display:none}}
</style>
</head><body>

</div>
