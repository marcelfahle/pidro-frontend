<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="pidro-ds-v2.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&amp;family=Nunito:wght@500;600;700;800;900&amp;display=swap">
<style>
body{margin:0;font-family:"Nunito",sans-serif;color:#ffffff;background:#07264c}
a{color:#8beaff}a:hover{color:#c4f4ff}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #FFD447;outline-offset:2px}
.segb{box-sizing:border-box;flex:1 1 0;min-width:0;height:40px;border-radius:9px;border:1px solid rgba(184,225,246,0.3);background:rgba(7,45,82,0.86);color:rgba(239,249,255,0.85);font-family:"Nunito",sans-serif;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.segb.on{border:2px solid #E2AF45;background:rgba(107,73,11,0.5);color:#FFD447}
.friend{box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:6px 10px;border-radius:12px;background:rgba(18,74,119,0.58);border:1px solid rgba(184,225,246,0.22);font:inherit;color:#ffffff;text-align:left;cursor:pointer}
.friend.on{border:2px solid #E2AF45;background:rgba(107,73,11,0.45);padding:5px 9px}
.dot{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:999px;background:#4fd37a;border:2px solid #0A2340}
</style>
</head><body>

<main class="felt" style="width: 390px; height: 844px; box-sizing: border-box">

<div aria-hidden="true" style="position: absolute; left: 20px; top: 59px; width: 350px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px"><span class="glass" style="width: 44px; height: 44px"><span class="face"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#CFEFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></span></span></div>
<div style="display: flex; gap: 8px"><span class="segb on" style="height: 56px; font-size: 15px">Finnish</span><span class="segb" style="height: 56px; font-size: 15px">Louisiana</span></div>
<div class="window" style="padding: 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px; min-height: 44px"><span class="ring" style="width: 40px; height: 40px; padding: 2.5px"><span class="face-initial" style="font-size: 17px">B</span></span><span style="display: flex; flex-direction: column; gap: 1px; width: 76px"><span class="label" style="font-size: 14px">You</span><span class="meta" style="color: #FFD447">Host</span></span></div>
<div style="display: flex; align-items: center; gap: 10px; min-height: 44px"><span class="chair-open" style="width: 40px; height: 40px; border-color: #E2AF45; color: #FFD447"></span><span class="label" style="font-size: 14px; width: 76px">Partner</span><div style="display: flex; gap: 4px; flex-grow: 1"><span class="segb" style="height: 44px">Open</span><span class="segb" style="height: 44px">Bot</span><span class="segb on" style="height: 44px">Friend</span></div></div>
</div>
</div>
<div class="scrim"></div>

<section class="sheet" role="dialog" aria-label="Invite a friend to the partner seat" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 20px 34px; display: flex; flex-direction: column; gap: 14px">
<span class="grabber" style="align-self: center"></span>
<div style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px">
<h2 class="display" style="font-size: 26px; line-height: 32px">Partner</h2>
<p class="meta">The seat is held for them until the game starts.</p>
</div>

<div style="position: relative">
<label for="friend-search" style="position: absolute; left: 0; top: 0; width: 0; height: 0; overflow: hidden">Search friends</label>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(184,225,246,0.7)" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 13px; top: 13px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input class="input" id="friend-search" type="search" placeholder="Search friends" style="height: 44px; padding-left: 40px; font-size: 15px">
</div>

<div role="radiogroup" aria-label="Friends" style="display: flex; flex-direction: column; gap: 8px">

<button type="button" role="radio" aria-checked="true" class="friend on" onclick="() =&gt; this.setState({ picked: f.id })">
<span style="position: relative; width: 40px; height: 40px; flex-shrink: 0">
<span class="ring" style="width: 40px; height: 40px; padding: 2.5px"><span class="face-initial" style="font-size: 17px">N</span></span>
<span class="lvl" style="bottom: -7px; min-width: 22px; height: 16px; padding: 0 4px; font-size: 9px">31</span>
<span class="dot" role="img" aria-label="Online"></span>
</span>
<span style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0">
<span class="label" style="font-size: 15px">Nora</span>
<span class="meta" style="color: #92e6b2">Online now</span>
</span>
<span class="radio" aria-hidden="true" style="border-color: #FFD447"><span style="width: 10px; height: 10px; border-radius: 999px; background: #FFD447"></span></span>
</button>

<button type="button" role="radio" aria-checked="false" class="friend" onclick="() =&gt; this.setState({ picked: f.id })">
<span style="position: relative; width: 40px; height: 40px; flex-shrink: 0">
<span class="ring glass-ring" style="width: 40px; height: 40px; padding: 2.5px"><span class="face-initial" style="font-size: 17px">K</span></span>
<span class="lvl glass-edge" style="bottom: -7px; min-width: 22px; height: 16px; padding: 0 4px; font-size: 9px">18</span>
<span class="dot" role="img" aria-label="Online"></span>
</span>
<span style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0">
<span class="label" style="font-size: 15px">Kalle</span>
<span class="meta" style="color: #92e6b2">Online now</span>
</span>
<span class="radio" aria-hidden="true" style="border-color: rgba(184, 225, 246, 0.6)"></span>
</button>

<button type="button" role="radio" aria-checked="false" class="friend" onclick="() =&gt; this.setState({ picked: f.id })">
<span style="position: relative; width: 40px; height: 40px; flex-shrink: 0">
<span class="ring glass-ring" style="width: 40px; height: 40px; padding: 2.5px"><span class="face-initial" style="font-size: 17px">M</span></span>
<span class="lvl glass-edge" style="bottom: -7px; min-width: 22px; height: 16px; padding: 0 4px; font-size: 9px">12</span>

</span>
<span style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0">
<span class="label" style="font-size: 15px">Mikko</span>
<span class="meta" style="color: rgba(239, 249, 255, 0.7)">Played yesterday</span>
</span>
<span class="radio" aria-hidden="true" style="border-color: rgba(184, 225, 246, 0.6)"></span>
</button>

<button type="button" role="radio" aria-checked="false" class="friend" onclick="() =&gt; this.setState({ picked: f.id })">
<span style="position: relative; width: 40px; height: 40px; flex-shrink: 0">
<span class="ring" style="width: 40px; height: 40px; padding: 2.5px"><span class="face-initial" style="font-size: 17px">H</span></span>
<span class="lvl" style="bottom: -7px; min-width: 22px; height: 16px; padding: 0 4px; font-size: 9px">41</span>

</span>
<span style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0">
<span class="label" style="font-size: 15px">Hanna</span>
<span class="meta" style="color: rgba(239, 249, 255, 0.7)">Played last week</span>
</span>
<span class="radio" aria-hidden="true" style="border-color: rgba(184, 225, 246, 0.6)"></span>
</button>

</div>

<a class="wood" href="Create-Table.dc.html" style="width: 100%; height: 58px; margin-top: 2px"><span class="face" style="font-size: 21px">Invite Nora</span></a>
<a class="glass" href="Create-Table.dc.html" style="width: 100%; height: 48px"><span class="face" style="font-size: 15px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CFEFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>Share a link instead</span></a>
</section>
</main>

</body></html>
