<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="pidro-ds-v2.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&amp;family=Nunito:wght@500;600;700;800;900&amp;display=swap">
<style>
body{margin:0;font-family:"Nunito",sans-serif;color:#ffffff;background:#07264c}
a{color:#8beaff}a:hover{color:#c4f4ff}
</style>
</head><body>

<main class="felt" style="width: 390px; height: 844px; box-sizing: border-box">

<div aria-hidden="true" style="position: absolute; left: 25px; top: 59px; width: 340px">
<div style="display: flex; align-items: center; gap: 12px; height: 44px"><span class="label" style="font-size: 17px; padding-left: 56px">New table</span></div>
<div class="tabletop" style="left: 92px; top: 170px; width: 156px; height: 160px"></div>
<span class="chair-open" style="position: absolute; left: 142px; top: 92px; width: 56px; height: 56px; border-color: #FFD447; border-style: solid; border-width: 3px"></span>
</div>
<div class="scrim"></div>

<section class="sheet" role="dialog" aria-label="Partner seat" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 20px 34px; display: flex; flex-direction: column; gap: 14px">
<span class="grabber" style="align-self: center"></span>
<div style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px">
<h2 class="display" style="font-size: 26px; line-height: 32px">Partner seat</h2>
<p class="meta">Your partner sits across from you and plays on your team.</p>
</div>

<div role="radiogroup" aria-label="Who sits here" style="display: flex; flex-direction: column; gap: 10px">

<button type="button" role="radio" aria-checked="true" class="choice on" onClick="">
<span style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: rgba(5, 36, 69, 0.9); border: 1px solid rgba(184, 225, 246, 0.3)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8beaff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12M6 12h12"></path></svg>


</span>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
<span class="label">Open seat</span>
<span class="meta" style="font-weight: 600; font-size: 13px; line-height: 18px">Anyone in Tables can sit here.</span>
</span>
<span class="radio" aria-hidden="true"></span>
</button>


<button type="button" role="radio" aria-checked="false" class="choice" onClick="">
<span style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: rgba(5, 36, 69, 0.9); border: 1px solid rgba(184, 225, 246, 0.3)">

<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#CFEFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="8" width="14" height="11" rx="3"></rect><path d="M12 8V5.5"></path><circle cx="12" cy="4.2" r="1.2"></circle><path d="M9.5 12.5v2M14.5 12.5v2"></path></svg>

</span>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
<span class="label">Bot</span>
<span class="meta" style="font-weight: 600; font-size: 13px; line-height: 18px">A bot plays this seat for the whole game.</span>
</span>
<span class="radio" aria-hidden="true"></span>
</button>


<button type="button" role="radio" aria-checked="false" class="choice" onClick="">
<span style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: rgba(5, 36, 69, 0.9); border: 1px solid rgba(184, 225, 246, 0.3)">


<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFD447" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>
</span>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
<span class="label">Invite a friend</span>
<span class="meta" style="font-weight: 600; font-size: 13px; line-height: 18px">You get a link to share once the table is open. The seat stays open until someone sits down.</span>
</span>
<span class="radio" aria-hidden="true"></span>
</button>

</div>

<a class="wood" href="Create-Table.dc.html" style="width: 100%; height: 58px; margin-top: 4px"><span class="face" style="font-size: 21px">Done</span></a>
</section>
</main>
</body></html>
