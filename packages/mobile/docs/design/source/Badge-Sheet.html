<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="pidro-ds-v2.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&amp;family=Nunito:wght@500;600;700;800;900&amp;display=swap">
<style>
body{margin:0;font-family:"Nunito",sans-serif;color:#ffffff;background:#07264c}
a{color:#8beaff}a:hover{color:#c4f4ff}
</style>
</head><body>

<main class="felt" style="width: 390px; height: 844px; box-sizing: border-box">
<div aria-hidden="true" style="position: absolute; left: 20px; top: 59px; height: 44px; display: flex; align-items: center"><span class="label" style="font-size: 17px; padding-left: 56px">Profile</span></div>
<div class="scrim"></div>

<section class="sheet" role="dialog" aria-label="Your badges" style="position: absolute; left: 0; right: 0; top: 118px; bottom: 0; padding: 10px 20px 34px; display: flex; flex-direction: column; align-items: center; gap: 14px">
<span class="grabber"></span>

<div style="position: relative; width: 92px; height: 92px; margin: 6px 0 8px; flex-shrink: 0">
<span class="ring" style="width: 92px; height: 92px; padding: 4.5px"><span class="face-initial" style="font-size: 40px">B</span></span>
<span class="medal" role="img" aria-label="Wearing the Pidro Classic pin" style="right: -6px; top: 0; width: 32px; height: 32px; padding: 2.5px"><span class="coin"><svg width="14" height="14" viewBox="0 0 24 24" fill="#FFD447" aria-hidden="true"><path d="M12 3c-3 3.6-7 6.2-7 10 0 2.2 1.7 3.8 3.8 3.8 1.2 0 2.2-.5 2.7-1.3-.2 1.7-.9 3.2-2.3 4.5h5.6c-1.4-1.3-2.1-2.8-2.3-4.5.5.8 1.5 1.3 2.7 1.3 2.1 0 3.8-1.6 3.8-3.8 0-3.8-4-6.4-7-10z"></path></svg></span></span>
<span class="lvl" style="bottom: -10px; min-width: 38px; height: 22px; padding: 0 8px; font-size: 12px">44</span>
</div>
<h2 class="display" style="font-size: 26px; line-height: 32px">Your badges</h2>

<div class="subtle" style="width: 100%; padding: 12px 14px; display: flex; align-items: center; gap: 14px">
<span class="ring" aria-hidden="true" style="width: 40px; height: 40px; padding: 3px; flex-shrink: 0"><span class="face-initial" style="border-width: 1px"></span></span>
<span style="display: flex; flex-direction: column; gap: 2px">
<span class="label">Gold ring · Supporter</span>
<span class="meta">Your Classic premium carried over. Gold while your plan is active.</span>
</span>
</div>

<div role="radiogroup" aria-label="Pin to wear" style="width: 100%; display: flex; flex-direction: column; gap: 10px">
<p class="eyebrow" style="padding-left: 4px">Pin to wear</p>

<button type="button" role="radio" aria-checked="true" class="choice on">
<span class="medal-inline" aria-hidden="true" style="width: 40px; height: 40px; padding: 2.5px; display: flex; flex-shrink: 0; border-radius: 999px; background: linear-gradient(180deg, #F6DE9A 0%, #E2AF45 35%, #C4892A 65%, #8F5E12 100%)"><span class="coin"><svg width="17" height="17" viewBox="0 0 24 24" fill="#FFD447"><path d="M12 3c-3 3.6-7 6.2-7 10 0 2.2 1.7 3.8 3.8 3.8 1.2 0 2.2-.5 2.7-1.3-.2 1.7-.9 3.2-2.3 4.5h5.6c-1.4-1.3-2.1-2.8-2.3-4.5.5.8 1.5 1.3 2.7 1.3 2.1 0 3.8-1.6 3.8-3.8 0-3.8-4-6.4-7-10z"></path></svg></span></span>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
<span class="label">Pidro Classic</span>
<span class="meta" style="font-weight: 600; font-size: 13px; line-height: 18px">Level 61 in Classic · 1,862 games as Bengt64</span>
</span>
<span class="radio" aria-hidden="true"></span>
</button>

<button type="button" role="radio" aria-checked="false" aria-disabled="true" class="choice" style="opacity: 0.55; cursor: default">
<span class="tester" aria-hidden="true" style="width: 40px; height: 40px; padding: 2.5px; flex-shrink: 0"><span class="coin"><svg width="17" height="17" viewBox="0 0 24 24" fill="#ffffff"><path d="M12 3c-3 3.6-7 6.2-7 10 0 2.2 1.7 3.8 3.8 3.8 1.2 0 2.2-.5 2.7-1.3-.2 1.7-.9 3.2-2.3 4.5h5.6c-1.4-1.3-2.1-2.8-2.3-4.5.5.8 1.5 1.3 2.7 1.3 2.1 0 3.8-1.6 3.8-3.8 0-3.8-4-6.4-7-10z"></path></svg></span></span>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
<span class="label">Founding Tester</span>
<span class="meta" style="font-weight: 600; font-size: 13px; line-height: 18px">Not earned. It went to players who finished a game before launch.</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CFEFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
</button>

<button type="button" role="radio" aria-checked="false" class="choice">
<span aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; box-sizing: border-box; border-radius: 999px; border: 2px dashed rgba(184, 225, 246, 0.5)"></span>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
<span class="label">No pin</span>
<span class="meta" style="font-weight: 600; font-size: 13px; line-height: 18px">Just your ring and level.</span>
</span>
<span class="radio" aria-hidden="true"></span>
</button>
</div>

<a class="wood" href="Main.dc.html" style="width: 100%; height: 58px; margin-top: auto; flex-shrink: 0"><span class="face" style="font-size: 21px">Done</span></a>
</section>
</main>
</body></html>
