<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="pidro-ds-v2.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&amp;family=Nunito:wght@500;600;700;800;900&amp;display=swap">
<style>
body{margin:0;font-family:"Nunito",sans-serif;color:#ffffff;background:#07264c}
a{color:#8beaff}a:hover{color:#c4f4ff}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #FFD447;outline-offset:2px}
:where(button.wood){padding:0;border:none;background:none;font:inherit;cursor:pointer}
.xl-pill{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 16px;border-radius:999px;background:rgba(139,234,255,0.1);border:1.5px solid rgba(139,234,255,0.45);color:#CFEFFF;font-family:"Nunito",sans-serif;font-weight:800;font-size:15px;cursor:pointer}
.xl-pill.on{background:rgba(226,175,69,0.2);border-color:#E2AF45;color:#FFD447}
.xl-row{box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;height:64px;padding:8px 12px;border-radius:14px;background:rgba(18,74,119,0.58);border:1px solid rgba(184,225,246,0.22);color:#ffffff;font-family:"Nunito",sans-serif;text-align:left;cursor:pointer}
.xl-row:hover{background:rgba(18,74,119,0.85)}
.xl-row.host{cursor:default;background:rgba(7,45,82,0.5)}
.xl-tok{position:relative;width:44px;height:44px;flex-shrink:0}
.xl-halo{position:absolute;left:-5px;top:-5px;width:54px;height:54px;border-radius:999px;border:2px dashed #E2AF45;box-sizing:border-box}
.xl-badge{position:absolute;right:-5px;bottom:-4px;box-sizing:border-box;min-width:22px;height:20px;padding:0 5px;border-radius:999px;background:#0A2340;border:1.5px solid #86CFEE;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:9px;color:#ffffff}
.xl-txt{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1 1 auto}
.xl-t{font-weight:800;font-size:16px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xl-s{font-weight:700;font-size:13px;line-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xl-meta{margin:0;font-weight:700;font-size:13px;line-height:18px;color:rgba(239,249,255,0.75)}
.xl-opt{box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:4px 12px 4px 10px;border:none;border-radius:10px;background:none;color:#ffffff;font-family:"Nunito",sans-serif;text-align:left;cursor:pointer}
.xl-opt:hover{background:rgba(139,234,255,0.08)}
.xl-opt.on{background:rgba(226,175,69,0.12)}
.xl-radio{box-sizing:border-box;width:22px;height:22px;border-radius:999px;border:2px solid rgba(184,225,246,0.6);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.xl-radio.on{border-color:#E2AF45}
.xl-radio.on::after{content:"";width:10px;height:10px;border-radius:999px;background:#FFD447}
.xl-group{display:flex;flex-direction:column;border-radius:12px;background:rgba(18,74,119,0.45);border:1px solid rgba(184,225,246,0.18);padding:3px}
.xl-pick{box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;height:56px;padding:6px 10px;border:none;border-radius:12px;background:rgba(18,74,119,0.45);color:#ffffff;font-family:"Nunito",sans-serif;text-align:left;cursor:pointer}
.xl-pick:hover{background:rgba(18,74,119,0.85)}
.xl-pick.cur{box-shadow:inset 0 0 0 2px #E2AF45;background:rgba(107,73,11,0.4)}
.xl-pick.off{opacity:0.5;cursor:default}
.xl-dot{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:999px;border:2px solid #0A2340;box-sizing:border-box}
.xl-x{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border-radius:999px;border:none;background:rgba(139,234,255,0.1);color:#CFEFFF;cursor:pointer}
</style>
</head><body>

<main class="felt" style="width: 844px; height: 390px; box-sizing: border-box; position: relative">

<a class="glass" href="#" aria-label="Back to Tables" style="position: absolute; left: 60px; top: 16px; width: 44px; height: 44px"><span class="face"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#CFEFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></span></a>
<h1 class="display" style="position: absolute; left: 116px; top: 22px; font-size: 22px; line-height: 30px">New table</h1>
<div role="radiogroup" aria-label="Rules" style="position: absolute; right: 60px; top: 18px; display: flex; align-items: center; gap: 8px">
<span class="xl-meta" style="margin-right: 4px">Trumps only · bids from 6</span>

<button type="button" role="radio" aria-checked="true" class="xl-pill on">Finnish</button>

<button type="button" role="radio" aria-checked="false" class="xl-pill">Louisiana</button>

</div>

<section aria-label="Your team" style="position: absolute; left: 60px; top: 74px; width: 334px; display: flex; flex-direction: column; gap: 8px">
<p class="eyebrow" style="padding: 0 4px; color: #FFD447">Your team</p>
<div class="xl-row host"><span class="xl-tok"><span class="ring" style="width: 44px; height: 44px; padding: 2.5px"><span class="face-initial" style="font-size: 19px">B</span></span></span><span class="xl-txt"><span class="xl-t" style="color: #FFD447">You</span><span class="xl-s" style="color: #FFD447">Host</span></span></div>

<button type="button" class="xl-row" aria-label="Partner: Maija, Invited when you open the table. Change">
<span class="xl-tok">


<span class="xl-halo" aria-hidden="true"></span><span class="ring" style="width: 44px; height: 44px; padding: 2.5px; opacity: 0.6"><span class="face-initial" style="font-size: 19px">M</span></span>

</span>
<span class="xl-txt"><span class="xl-t" style="color: #FFD447">Maija</span><span class="xl-s" style="color: #FFD447">Invited when you open the table</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(184,225,246,0.75)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 5l7 7-7 7"></path></svg>
</button>

</section>

<span class="display" aria-hidden="true" style="position: absolute; left: 404px; top: 160px; width: 36px; text-align: center; font-size: 18px; line-height: 22px; color: #FFD447">vs</span>

<section aria-label="Opponents" style="position: absolute; left: 450px; top: 74px; width: 334px; display: flex; flex-direction: column; gap: 8px">
<p class="eyebrow" style="padding: 0 4px">Opponents</p>

<button type="button" class="xl-row" aria-label="Opponent: Open seat, 100+ games played. Change">
<span class="xl-tok">
<span class="chair-open" style="width: 44px; height: 44px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12M6 12h12"></path></svg></span>


<span class="xl-badge">100</span>
</span>
<span class="xl-txt"><span class="xl-t" style="color: #8beaff">Open seat</span><span class="xl-s" style="color: rgba(239, 249, 255, 0.72)">100+ games played</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(184,225,246,0.75)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 5l7 7-7 7"></path></svg>
</button>

<button type="button" class="xl-row" aria-label="Opponent: Bot, Plays right away. Change">
<span class="xl-tok">

<span class="ring glass-ring" style="width: 44px; height: 44px; padding: 2.5px"><span class="face-initial bot"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="8" width="14" height="11" rx="3"></rect><path d="M12 8V5.5"></path><circle cx="12" cy="4.2" r="1.2"></circle><path d="M9.5 12.5v2M14.5 12.5v2"></path></svg></span></span>


</span>
<span class="xl-txt"><span class="xl-t" style="color: #ffffff">Bot</span><span class="xl-s" style="color: rgba(239, 249, 255, 0.72)">Plays right away</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(184,225,246,0.75)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 5l7 7-7 7"></path></svg>
</button>

</section>

<div style="position: absolute; left: 60px; right: 60px; bottom: 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
<p class="xl-meta" style="flex: 1 1 auto">Open seats are listed in Tables. Maija gets an invitation.</p>
<button type="button" class="wood" style="width: 300px; height: 54px; flex-shrink: 0"><span class="face" style="font-size: 20px">Open the table</span></button>
</div>


<section class="felt" role="dialog" aria-label="Opponent seat" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 14px 60px 14px 60px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 12px">
<button type="button" class="xl-x" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<h2 class="display" style="font-size: 22px; line-height: 28px">Opponent seat</h2>
<p class="xl-meta">Plays on the other team</p>
</div>
<div style="display: flex; gap: 20px; flex: 1 1 auto; min-height: 0">
<div role="radiogroup" aria-label="Seat type" style="width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px">
<div class="xl-group">

<button type="button" role="radio" aria-checked="false" class="xl-opt">
<span class="xl-txt"><span class="xl-t" style="font-size: 15px">Bot</span><span class="xl-s" style="color: rgba(239, 249, 255, 0.72); font-size: 12px">Plays right away</span></span>
<span class="xl-radio" aria-hidden="true"></span>
</button>

<button type="button" role="radio" aria-checked="false" class="xl-opt">
<span class="xl-txt"><span class="xl-t" style="font-size: 15px">Anyone</span><span class="xl-s" style="color: rgba(239, 249, 255, 0.72); font-size: 12px">Anyone can join from Tables</span></span>
<span class="xl-radio" aria-hidden="true"></span>
</button>

<button type="button" role="radio" aria-checked="true" class="xl-opt on">
<span class="xl-txt"><span class="xl-t" style="font-size: 15px">100+ games played</span><span class="xl-s" style="color: rgba(239, 249, 255, 0.72); font-size: 12px">Some experience</span></span>
<span class="xl-radio on" aria-hidden="true"></span>
</button>

<button type="button" role="radio" aria-checked="false" class="xl-opt">
<span class="xl-txt"><span class="xl-t" style="font-size: 15px">1000+ games played</span><span class="xl-s" style="color: rgba(239, 249, 255, 0.72); font-size: 12px">Very experienced players</span></span>
<span class="xl-radio" aria-hidden="true"></span>
</button>

<button type="button" role="radio" aria-checked="false" class="xl-opt">
<span class="xl-txt"><span class="xl-t" style="font-size: 15px">With password 4821</span><span class="xl-s" style="color: rgba(239, 249, 255, 0.72); font-size: 12px">Only people you give it to</span></span>
<span class="xl-radio" aria-hidden="true"></span>
</button>

</div>
</div>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<p class="eyebrow" style="padding: 0 4px">Or invite a friend</p>
<label for="xl-find" style="position: absolute; width: 0; height: 0; overflow: hidden">Find a friend</label>
<input class="input" id="xl-find" type="search" placeholder="Find a friend" style="height: 44px; font-size: 15px; flex-shrink: 0">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; overflow: hidden">

<button type="button" class="xl-pick" aria-label="Maija, Online now. Invite">
<span style="position: relative; width: 40px; height: 40px; flex-shrink: 0"><span class="ring" style="width: 40px; height: 40px; padding: 2.5px"><span class="face-initial" style="font-size: 17px">M</span></span><span class="xl-dot" style="background: #4fd37a"></span></span>
<span class="xl-txt"><span class="xl-t" style="font-size: 15px">Maija</span><span class="xl-s" style="font-size: 12px; color: #92e6b2">Online now</span></span>
</button>

<button type="button" class="xl-pick" aria-label="Pekka, With bots · can join now. Invite">
<span style="position: relative; width: 40px; height: 40px; flex-shrink: 0"><span class="ring" style="width: 40px; height: 40px; padding: 2.5px"><span class="face-initial" style="font-size: 17px">P</span></span><span class="xl-dot" style="background: #4fd37a"></span></span>
<span class="xl-txt"><span class="xl-t" style="font-size: 15px">Pekka</span><span class="xl-s" style="font-size: 12px; color: #92e6b2">With bots · can join now</span></span>
</button>

<button type="button" class="xl-pick" aria-label="Hanna, Not online. Invite">
<span style="position: relative; width: 40px; height: 40px; flex-shrink: 0"><span class="ring" style="width: 40px; height: 40px; padding: 2.5px"><span class="face-initial" style="font-size: 17px">H</span></span></span>
<span class="xl-txt"><span class="xl-t" style="font-size: 15px">Hanna</span><span class="xl-s" style="font-size: 12px; color: rgba(239, 249, 255, 0.72)">Not online</span></span>
</button>

<button type="button" class="xl-pick" aria-label="Mikko, Not online. Invite">
<span style="position: relative; width: 40px; height: 40px; flex-shrink: 0"><span class="ring glass-ring" style="width: 40px; height: 40px; padding: 2.5px"><span class="face-initial" style="font-size: 17px">M</span></span></span>
<span class="xl-txt"><span class="xl-t" style="font-size: 15px">Mikko</span><span class="xl-s" style="font-size: 12px; color: rgba(239, 249, 255, 0.72)">Not online</span></span>
</button>

<button type="button" class="xl-pick" aria-label="Sanna, Not online. Invite">
<span style="position: relative; width: 40px; height: 40px; flex-shrink: 0"><span class="ring glass-ring" style="width: 40px; height: 40px; padding: 2.5px"><span class="face-initial" style="font-size: 17px">S</span></span></span>
<span class="xl-txt"><span class="xl-t" style="font-size: 15px">Sanna</span><span class="xl-s" style="font-size: 12px; color: rgba(239, 249, 255, 0.72)">Not online</span></span>
</button>

<button type="button" class="xl-pick" aria-label="Erkki, Not online. Invite">
<span style="position: relative; width: 40px; height: 40px; flex-shrink: 0"><span class="ring" style="width: 40px; height: 40px; padding: 2.5px"><span class="face-initial" style="font-size: 17px">E</span></span></span>
<span class="xl-txt"><span class="xl-t" style="font-size: 15px">Erkki</span><span class="xl-s" style="font-size: 12px; color: rgba(239, 249, 255, 0.72)">Not online</span></span>
</button>

<button type="button" class="xl-pick off" aria-label="Nora, In a game with others, can’t be invited now" disabled="true">
<span style="position: relative; width: 40px; height: 40px; flex-shrink: 0"><span class="ring" style="width: 40px; height: 40px; padding: 2.5px"><span class="face-initial" style="font-size: 17px">N</span></span><span class="xl-dot" style="background: #FFD447"></span></span>
<span class="xl-txt"><span class="xl-t" style="font-size: 15px">Nora</span><span class="xl-s" style="font-size: 12px; color: #FFD447">In a game with others</span></span>
</button>

</div>
</div>
</div>
</section>

</main>

</body></html>
