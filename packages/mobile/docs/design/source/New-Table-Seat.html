<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="pidro-ds-v2.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&amp;family=Nunito:wght@500;600;700;800;900&amp;display=swap">
<style>
body{margin:0;font-family:"Nunito",sans-serif;color:#ffffff;background:#07264c}
a{color:#8beaff}a:hover{color:#c4f4ff}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #FFD447;outline-offset:2px}
:where(button.wood,button.glass){padding:0;border:none;background:none;font:inherit;cursor:pointer}
.el-pill{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 14px;border-radius:999px;background:rgba(139,234,255,0.1);border:1.5px solid rgba(139,234,255,0.45);color:#CFEFFF;font-family:"Nunito",sans-serif;font-weight:800;font-size:15px;white-space:nowrap;cursor:pointer}
.el-pill:hover{background:rgba(139,234,255,0.2)}
.el-pill.on{background:rgba(226,175,69,0.2);border-color:#E2AF45;color:#FFD447}
.el-row{box-sizing:border-box;display:flex;align-items:center;gap:14px;width:100%;min-height:70px;padding:10px 12px;border-radius:14px;background:rgba(18,74,119,0.58);border:1px solid rgba(184,225,246,0.22);color:#ffffff;font-family:"Nunito",sans-serif;text-align:left;cursor:pointer}
.el-row:hover{background:rgba(18,74,119,0.85);border-color:rgba(184,225,246,0.45)}
.el-row.host{cursor:default;background:rgba(7,45,82,0.5)}
.el-tok{position:relative;width:48px;height:48px;flex-shrink:0}
.el-halo{position:absolute;left:-5px;top:-5px;width:58px;height:58px;border-radius:999px;border:2px dashed #E2AF45;box-sizing:border-box}
.el-badge{position:absolute;right:-5px;bottom:-4px;box-sizing:border-box;min-width:22px;height:22px;padding:0 5px;border-radius:999px;background:#0A2340;border:1.5px solid #86CFEE;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:9px;color:#ffffff}
.el-badge.gold{border-color:#E2AF45}
.el-txt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 auto}
.el-t{font-weight:800;font-size:17px;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.el-s{font-weight:700;font-size:14px;line-height:18px}
.el-meta{margin:0;font-weight:700;font-size:13px;line-height:18px;color:rgba(239,249,255,0.75)}
.el-vs{display:flex;align-items:center;gap:12px;padding:2px 8px}
.el-vs span.l{height:1px;flex:1;background:linear-gradient(90deg,rgba(226,175,69,0),rgba(226,175,69,0.7))}
.el-vs span.r{height:1px;flex:1;background:linear-gradient(90deg,rgba(226,175,69,0.7),rgba(226,175,69,0))}
.el-scrim{position:absolute;left:0;top:0;right:0;bottom:0;width:100%;padding:0;border:none;background:rgba(2,14,30,0.62);cursor:pointer}
.el-opt{box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:6px 14px 6px 12px;border:none;border-radius:12px;background:none;color:#ffffff;font-family:"Nunito",sans-serif;text-align:left;cursor:pointer}
.el-opt:hover{background:rgba(139,234,255,0.08)}
.el-opt.on{background:rgba(226,175,69,0.12)}
.el-oi{box-sizing:border-box;width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(139,234,255,0.12);color:#CFEFFF}
.el-radio{box-sizing:border-box;width:24px;height:24px;border-radius:999px;border:2px solid rgba(184,225,246,0.6);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.el-radio.on{border-color:#E2AF45}
.el-radio.on::after{content:"";width:12px;height:12px;border-radius:999px;background:#FFD447}
.el-group{display:flex;flex-direction:column;border-radius:14px;background:rgba(18,74,119,0.45);border:1px solid rgba(184,225,246,0.18);padding:4px}
.el-sep{height:1px;margin:0 12px;background:rgba(184,225,246,0.14)}
.el-pick{box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:8px 12px;border:none;border-radius:12px;background:none;color:#ffffff;font-family:"Nunito",sans-serif;text-align:left;cursor:pointer;flex-shrink:0}
.el-pick:hover{background:rgba(139,234,255,0.08)}
.el-pick.off{opacity:0.5;cursor:default}
.el-pick.cur{background:rgba(226,175,69,0.14)}
.el-dot{position:absolute;right:-2px;bottom:-2px;width:13px;height:13px;border-radius:999px;border:2px solid #0A2340;box-sizing:border-box}
.el-dot.online{background:#4fd37a}.el-dot.table{background:#FFD447}
.el-fs{font-weight:700;font-size:13px;line-height:17px;color:rgba(239,249,255,0.75)}
.el-fs.online{color:#92e6b2}.el-fs.table{color:#FFD447}
.el-back{box-sizing:border-box;display:inline-flex;align-items:center;gap:4px;height:44px;padding:0 10px 0 4px;border:none;background:none;border-radius:10px;color:#8beaff;font-family:"Nunito",sans-serif;font-weight:800;font-size:15px;cursor:pointer}
</style>
</head><body>

<main class="felt" style="width: 390px; height: 844px; box-sizing: border-box; padding: 59px 20px 34px; display: flex; flex-direction: column; gap: 12px; position: relative">

<header style="display: flex; align-items: center; gap: 12px">
<a class="glass" href="#" aria-label="Back to Tables" style="width: 44px; height: 44px; flex-shrink: 0"><span class="face"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#CFEFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></span></a>
<div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 1px">
<h1 class="display" style="font-size: 24px; line-height: 30px">New table</h1>

</div>
</header>


<div role="radiogroup" aria-label="Rules" style="display: flex; gap: 8px">

<button type="button" role="radio" aria-checked="true" class="el-pill on" style="flex: 1 1 0">Finnish</button>

<button type="button" role="radio" aria-checked="false" class="el-pill" style="flex: 1 1 0">Louisiana</button>

</div>
<p class="el-meta" style="text-align: center; margin-top: -4px">Trumps only · bids from 6</p>


<section aria-label="Your team" style="display: flex; flex-direction: column; gap: 8px; margin-top: 6px">
<p class="eyebrow" style="padding: 0 4px; color: #FFD447">Your team</p>
<div class="el-row host">
<span class="el-tok"><span class="ring" style="width: 48px; height: 48px; padding: 2.5px"><span class="face-initial" style="font-size: 21px">B</span></span></span>
<span class="el-txt"><span class="el-t" style="color: #FFD447">You</span><span class="el-s" style="color: #FFD447">Host</span></span>
</div>

<button type="button" class="el-row" aria-label="Partner: Maija, Invited when you open the table. Change">
<span class="el-tok">


<span class="el-halo" aria-hidden="true"></span><span class="ring" style="width: 48px; height: 48px; padding: 2.5px; opacity: 0.6"><span class="face-initial" style="font-size: 21px">M</span></span>

</span>
<span class="el-txt"><span class="el-t" style="color: #FFD447">Maija</span><span class="el-s" style="color: #FFD447">Invited when you open the table</span></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(184,225,246,0.75)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 5l7 7-7 7"></path></svg>
</button>

</section>

<div class="el-vs" aria-hidden="true"><span class="l"></span><span class="display" style="font-size: 18px; line-height: 22px; color: #FFD447">vs</span><span class="r"></span></div>

<section aria-label="Opponents" style="display: flex; flex-direction: column; gap: 8px">
<p class="eyebrow" style="padding: 0 4px">Opponents</p>

<button type="button" class="el-row" aria-label="Opponent: Open seat, 100+ games played. Change">
<span class="el-tok">
<span class="chair-open" style="width: 48px; height: 48px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12M6 12h12"></path></svg></span>


<span class="el-badge">100</span>
</span>
<span class="el-txt"><span class="el-t" style="color: #8beaff">Open seat</span><span class="el-s" style="color: rgba(239, 249, 255, 0.72)">100+ games played</span></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(184,225,246,0.75)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 5l7 7-7 7"></path></svg>
</button>

<button type="button" class="el-row" aria-label="Opponent: Bot, Plays right away. Change">
<span class="el-tok">

<span class="ring glass-ring" style="width: 48px; height: 48px; padding: 2.5px"><span class="face-initial bot"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="8" width="14" height="11" rx="3"></rect><path d="M12 8V5.5"></path><circle cx="12" cy="4.2" r="1.2"></circle><path d="M9.5 12.5v2M14.5 12.5v2"></path></svg></span></span>


</span>
<span class="el-txt"><span class="el-t" style="color: #ffffff">Bot</span><span class="el-s" style="color: rgba(239, 249, 255, 0.72)">Plays right away</span></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(184,225,246,0.75)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 5l7 7-7 7"></path></svg>
</button>

</section>

<span style="flex-grow: 1"></span>

<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<button type="button" class="wood" style="width: 350px; height: 60px"><span class="face" style="font-size: 22px; letter-spacing: 0.5px">Open the table</span></button>

<p class="el-meta" style="text-align: center">Open seats are listed in Tables. Maija gets an invitation.</p>
</div>


<button type="button" class="el-scrim" aria-label="Close"></button>
<section class="sheet" role="dialog" aria-label="Opponent seat" style="position: absolute; left: 0; right: 0; bottom: 0; top: 230px; box-sizing: border-box; padding: 10px 16px 34px; display: flex; flex-direction: column; gap: 12px">
<span class="grabber" style="align-self: center"></span>


<div style="display: flex; flex-direction: column; gap: 2px; padding: 0 6px">
<h2 class="display" style="font-size: 24px; line-height: 30px">Opponent seat</h2>
<p class="el-meta" style="font-size: 14px">Plays on the other team.</p>
</div>
<div role="radiogroup" aria-label="Opponent seat" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">
<p class="eyebrow" style="padding: 0 8px">Fill it now</p>
<div class="el-group">
<button type="button" role="radio" aria-checked="false" class="el-opt">
<span class="el-oi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c.8-4 4-6.5 8-6.5s7.2 2.5 8 6.5"></path></svg></span>
<span class="el-txt"><span class="el-t" style="font-size: 16px">A friend</span><span class="el-fs">Choose who to invite</span></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(184,225,246,0.75)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</button>
<span class="el-sep"></span>

<button type="button" role="radio" aria-checked="false" class="el-opt">
<span class="el-oi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="8" width="14" height="11" rx="3"></rect><path d="M12 8V5.5"></path><path d="M9.5 12.5v2M14.5 12.5v2"></path></svg></span>
<span class="el-txt"><span class="el-t" style="font-size: 16px">Bot</span><span class="el-fs">Plays right away</span></span>
<span class="el-radio" aria-hidden="true"></span>
</button>

</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<p class="eyebrow" style="padding: 0 8px">Leave it open</p>
<div class="el-group">


<button type="button" role="radio" aria-checked="false" class="el-opt">
<span class="el-oi" style="font-weight: 900; font-size: 11px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12M6 12h12"></path></svg></span>
<span class="el-txt"><span class="el-t" style="font-size: 16px">Anyone</span><span class="el-fs">Anyone can join from Tables</span></span>
<span class="el-radio" aria-hidden="true"></span>
</button>

<span class="el-sep"></span>
<button type="button" role="radio" aria-checked="true" class="el-opt on">
<span class="el-oi" style="font-weight: 900; font-size: 11px"><span aria-hidden="true">100</span></span>
<span class="el-txt"><span class="el-t" style="font-size: 16px">100+ games played</span><span class="el-fs">For players with some experience</span></span>
<span class="el-radio on" aria-hidden="true"></span>
</button>

<span class="el-sep"></span>
<button type="button" role="radio" aria-checked="false" class="el-opt">
<span class="el-oi" style="font-weight: 900; font-size: 11px"><span aria-hidden="true">1k</span></span>
<span class="el-txt"><span class="el-t" style="font-size: 16px">1000+ games played</span><span class="el-fs">For very experienced players</span></span>
<span class="el-radio" aria-hidden="true"></span>
</button>

<span class="el-sep"></span>
<button type="button" role="radio" aria-checked="false" class="el-opt">
<span class="el-oi" style="font-weight: 900; font-size: 11px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span>
<span class="el-txt"><span class="el-t" style="font-size: 16px">With password 4821</span><span class="el-fs">Only people you give it to can sit</span></span>
<span class="el-radio" aria-hidden="true"></span>
</button>

</div>
</div>
</div>



</section>

</main>

</body></html>
