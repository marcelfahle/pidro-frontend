name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

# Faster runners: install the Blacksmith GitHub app (blacksmith.sh) on this
# repo, then flip every job with a single repo variable — no commit needed:
#   gh variable set CI_RUNNER --body blacksmith-4vcpu-ubuntu-2404
# Unset the variable to fall back to GitHub-hosted runners.

jobs:
  quality:
    name: Mobile quality
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build shared package
        run: bun run shared:build

      - name: Run unit tests
        run: bun run test:unit

      - name: Check mobile source
        working-directory: packages/mobile
        run: |
          bun run lint
          bunx tsc --noEmit
          bunx expo install --check

      - name: Export production web bundle
        working-directory: packages/mobile
        env:
          EXPO_NO_DOTENV: '1'
          NODE_OPTIONS: --require ./scripts/tailwind-v3-resolve.cjs
        run: bunx expo export --platform web --output-dir /tmp/pidro-mobile-web

  ui-grammar:
    name: UI grammar
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build shared package
        run: bun run shared:build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium for UI verification
        run: bunx playwright install --with-deps chromium

      - name: Verify mobile UI grammar
        working-directory: packages/mobile
        env:
          CI: '1'
          EXPO_NO_DOTENV: '1'
          NODE_OPTIONS: --require ./scripts/tailwind-v3-resolve.cjs
          UI_SHOT_DIR: /tmp/ui-grammar-screens
        run: |
          bunx expo start --web --port 8081 > /tmp/pidro-expo.log 2>&1 &
          expo_pid=$!
          cleanup() {
            kill "$expo_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8081/home >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            cat /tmp/pidro-expo.log
            exit 1
          fi

          bun run test:ui

      - name: Compare against visual baselines
        working-directory: packages/mobile
        env:
          UI_SHOT_DIR: /tmp/ui-grammar-screens
        run: bun run test:ui:diff

      - name: Upload UI grammar screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-grammar-screenshots
          path: /tmp/ui-grammar-screens/
          if-no-files-found: ignore
          retention-days: 14

  game-e2e:
    name: Game e2e
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out frontend
        uses: actions/checkout@v4

      - name: Check out backend
        uses: actions/checkout@v4
        with:
          repository: marcelfahle/pidro-backend
          path: backend

      - name: Set up Erlang/Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: backend/.tool-versions
          version-type: strict

      - name: Cache mix deps and build
        uses: actions/cache@v4
        with:
          path: |
            backend/deps
            backend/_build
          key: mix-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('backend/mix.lock') }}

      - name: Compile backend and prepare database
        working-directory: backend
        run: |
          mix deps.get
          mix compile
          mix ecto.create
          mix ecto.migrate

      - name: Start backend with CI game pacing
        working-directory: backend
        env:
          PORT: '4000'
          LIFECYCLE_TURN_TIMER_BID_MS: '1200'
          LIFECYCLE_TURN_TIMER_PLAY_MS: '900'
          LIFECYCLE_BOT_DELAY_MS: '60'
          LIFECYCLE_BOT_DELAY_VARIANCE_MS: '40'
          LIFECYCLE_BOT_MIN_DELAY_MS: '20'
          LIFECYCLE_TRICK_TRANSITION_DELAY_MS: '80'
          LIFECYCLE_HAND_TRANSITION_DELAY_MS: '120'
        run: |
          nohup mix phx.server > /tmp/pidro-backend.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -s -o /dev/null http://127.0.0.1:4000/api/v1/rooms; then
              echo "backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "backend never became ready"
          cat /tmp/pidro-backend.log
          exit 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build shared package
        run: bun run shared:build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium for the UI game
        run: bunx playwright install --with-deps chromium

      - name: Play full games (solo protocol + multiplayer UI with video)
        working-directory: packages/mobile
        env:
          CI: '1'
          EXPO_NO_DOTENV: '1'
          NODE_OPTIONS: --require ./scripts/tailwind-v3-resolve.cjs
          E2E_ARTIFACT_DIR: /tmp/game-e2e-artifacts
        run: |
          bunx expo start --web --port 8081 > /tmp/pidro-expo.log 2>&1 &
          expo_pid=$!
          cleanup() {
            kill "$expo_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8081/home >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            cat /tmp/pidro-expo.log
            exit 1
          fi

          node scripts/ci-game-e2e.mjs

      - name: Upload game video and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-e2e-artifacts
          path: |
            /tmp/game-e2e-artifacts/
            /tmp/pidro-backend.log
            /tmp/pidro-expo.log
          if-no-files-found: ignore
          retention-days: 14
