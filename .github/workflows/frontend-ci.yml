name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

# Faster runners: install the Blacksmith GitHub app (blacksmith.sh) on this
# repo, then flip every job with a single repo variable — no commit needed:
#   gh variable set CI_RUNNER --body blacksmith-4vcpu-ubuntu-2404
# Unset the variable to fall back to GitHub-hosted runners.

jobs:
  quality:
    name: Mobile quality
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build shared package
        run: bun run shared:build

      - name: Run unit tests
        run: bun run test:unit

      - name: Check mobile source
        working-directory: packages/mobile
        run: |
          bun run lint
          bunx tsc --noEmit
          bunx expo install --check

      - name: Export production web bundle
        working-directory: packages/mobile
        env:
          EXPO_NO_DOTENV: '1'
          NODE_OPTIONS: --require ./scripts/tailwind-v3-resolve.cjs
        run: bunx expo export --platform web --output-dir /tmp/pidro-mobile-web

  ui-grammar:
    name: UI grammar
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build shared package
        run: bun run shared:build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium for UI verification
        run: bunx playwright install --with-deps chromium

      - name: Verify mobile UI grammar
        working-directory: packages/mobile
        env:
          CI: '1'
          EXPO_NO_DOTENV: '1'
          # The full fixture matrix retains Metro/SSR modules across many navigations.
          NODE_OPTIONS: --max-old-space-size=4096 --require ./scripts/tailwind-v3-resolve.cjs
          UI_SHOT_DIR: /tmp/ui-grammar-screens
        run: |
          cleanup() {
            kill "$expo_pid" 2>/dev/null || true
            wait "$expo_pid" 2>/dev/null || true
          }
          start_expo() {
            # Track the server itself, not a package-manager wrapper.
            ../../node_modules/.bin/expo start --web --port 8081 >> /tmp/pidro-expo.log 2>&1 &
            expo_pid=$!
            trap cleanup EXIT

            ready=false
            for attempt in $(seq 1 60); do
              if curl --fail --silent http://127.0.0.1:8081/home >/dev/null; then
                ready=true
                break
              fi
              sleep 1
            done

            if [ "$ready" != "true" ]; then
              cat /tmp/pidro-expo.log
              exit 1
            fi
          }
          start_expo

          bun run test:ui
          # The screenshot matrix retains enough Metro/SSR state to starve later page loads.
          # The remaining suites are independent, so continue against a fresh server.
          cleanup
          start_expo
          UI_SHOT_DIR=/tmp/ui-grammar-screens/table-chrome node scripts/verify-table-chrome.mjs
          node scripts/verify-seat-decisions.mjs
          node scripts/verify-dealing.mjs
          UI_SHOT_DIR=/tmp/lobby-screens node scripts/verify-lobby.mjs
          UI_SHOT_DIR=/tmp/ui-grammar-screens/creation node scripts/verify-create-room.mjs
          # Bound Metro/SSR retention: the preceding matrix approaches the heap limit.
          # Waiting-seat checks are independent and need no state from earlier suites.
          cleanup
          start_expo
          # Additional sizes/scales are assertion-gated; their captures are diagnostic artifacts.
          # The waiting-room pixel baselines come from test:ui above (three standard viewports).
          UI_SHOT_DIR=/tmp/ui-grammar-screens/waiting-seats node scripts/verify-waiting-seats.mjs
          cleanup
          start_expo
          UI_SHOT_DIR=/tmp/ui-grammar-screens/game-over node scripts/verify-game-over.mjs

      - name: Compare against visual baselines
        working-directory: packages/mobile
        env:
          UI_SHOT_DIR: /tmp/ui-grammar-screens
        run: bun run test:ui:diff

      - name: Upload UI grammar screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-grammar-screenshots
          path: /tmp/ui-grammar-screens/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lobby diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lobby-screenshots
          path: |
            /tmp/lobby-screens/
            /tmp/pidro-expo.log
          if-no-files-found: ignore
          retention-days: 14

  game-e2e:
    name: Game e2e
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out frontend
        uses: actions/checkout@v4

      - name: Check out backend
        uses: actions/checkout@v4
        with:
          repository: marcelfahle/pidro-backend
          path: backend

      - name: Set up Erlang/Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: backend/.tool-versions
          version-type: strict

      - name: Cache mix deps and build
        uses: actions/cache@v4
        with:
          path: |
            backend/deps
            backend/_build
          key: mix-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('backend/mix.lock') }}

      - name: Compile backend and prepare database
        working-directory: backend
        run: |
          mix deps.get
          mix compile
          mix ecto.create
          mix ecto.migrate

      - name: Start backend with CI game pacing
        working-directory: backend
        env:
          PORT: '4000'
          LIFECYCLE_TURN_TIMER_BID_MS: '1200'
          LIFECYCLE_TURN_TIMER_PLAY_MS: '900'
          LIFECYCLE_BOT_DELAY_MS: '60'
          LIFECYCLE_BOT_DELAY_VARIANCE_MS: '40'
          LIFECYCLE_BOT_MIN_DELAY_MS: '20'
          LIFECYCLE_TRICK_TRANSITION_DELAY_MS: '80'
          LIFECYCLE_HAND_TRANSITION_DELAY_MS: '120'
        run: |
          nohup mix phx.server > /tmp/pidro-backend.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -s -o /dev/null http://127.0.0.1:4000/api/v1/rooms; then
              echo "backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "backend never became ready"
          cat /tmp/pidro-backend.log
          exit 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build shared package
        run: bun run shared:build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium for the UI game
        run: bunx playwright install --with-deps chromium

      - name: Play full games (solo protocol + multiplayer UI with video)
        working-directory: packages/mobile
        env:
          CI: '1'
          EXPO_NO_DOTENV: '1'
          NODE_OPTIONS: --require ./scripts/tailwind-v3-resolve.cjs
          E2E_ARTIFACT_DIR: /tmp/game-e2e-artifacts
        run: |
          bunx expo start --web --port 8081 > /tmp/pidro-expo.log 2>&1 &
          expo_pid=$!
          cleanup() {
            kill "$expo_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8081/home >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            cat /tmp/pidro-expo.log
            exit 1
          fi

          node scripts/ci-game-e2e.mjs

      - name: Upload game video and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-e2e-artifacts
          path: |
            /tmp/game-e2e-artifacts/
            /tmp/pidro-backend.log
            /tmp/pidro-expo.log
          if-no-files-found: ignore
          retention-days: 14

  account-e2e:
    name: Account e2e
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out frontend
        uses: actions/checkout@v4

      - name: Check out backend
        uses: actions/checkout@v4
        with:
          repository: marcelfahle/pidro-backend
          path: backend

      - name: Set up Erlang/Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: backend/.tool-versions
          version-type: strict

      - name: Cache mix deps and build
        uses: actions/cache@v4
        with:
          path: |
            backend/deps
            backend/_build
          key: mix-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('backend/mix.lock') }}

      - name: Compile backend and prepare database
        working-directory: backend
        run: |
          mix deps.get
          mix compile
          mix ecto.create
          mix ecto.migrate

      - name: Reserve the Classic names the journeys use
        working-directory: backend
        run: mix pidro.import_classic_name_reservations "$GITHUB_WORKSPACE/packages/mobile/e2e/classic-name-reservations.json"

      - name: Start backend with CI game pacing
        working-directory: backend
        env:
          PORT: '4000'
          LIFECYCLE_TURN_TIMER_BID_MS: '1200'
          LIFECYCLE_TURN_TIMER_PLAY_MS: '900'
          LIFECYCLE_BOT_DELAY_MS: '60'
          LIFECYCLE_BOT_DELAY_VARIANCE_MS: '40'
          LIFECYCLE_BOT_MIN_DELAY_MS: '20'
          LIFECYCLE_TRICK_TRANSITION_DELAY_MS: '80'
          LIFECYCLE_HAND_TRANSITION_DELAY_MS: '120'
        run: |
          nohup mix phx.server > /tmp/pidro-backend.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -s -o /dev/null http://127.0.0.1:4000/api/v1/rooms; then
              echo "backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "backend never became ready"
          cat /tmp/pidro-backend.log
          exit 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build shared package
        run: bun run shared:build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium for the journeys
        run: bunx playwright install --with-deps chromium

      - name: Run the account journeys
        working-directory: packages/mobile
        env:
          CI: '1'
          EXPO_NO_DOTENV: '1'
          NODE_OPTIONS: --require ./scripts/tailwind-v3-resolve.cjs
        run: |
          # The reset email links to the old web client; the journeys follow that link.
          (cd ../web && NODE_OPTIONS= VITE_API_URL=http://127.0.0.1:4000 VITE_WS_URL=ws://127.0.0.1:4000/socket \
            bun run dev --host 127.0.0.1 --port 5173 > /tmp/pidro-web.log 2>&1) &
          web_pid=$!
          bunx expo start --web --port 8081 > /tmp/pidro-expo.log 2>&1 &
          expo_pid=$!
          cleanup() {
            kill "$expo_pid" "$web_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          web_ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              web_ready=true
              break
            fi
            sleep 1
          done
          if [ "$web_ready" != "true" ]; then
            cat /tmp/pidro-web.log
            exit 1
          fi

          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8081/home >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            cat /tmp/pidro-expo.log
            exit 1
          fi

          # Build the bundle now, so the first journey does not wait for Metro.
          bundle=$(curl --silent http://127.0.0.1:8081/home | grep -o 'src="[^"]*\.bundle[^"]*"' | head -1 | cut -d'"' -f2 | sed 's/&amp;/\&/g')
          curl --fail --silent --output /dev/null "http://127.0.0.1:8081$bundle"

          bun run e2e:accounts

      - name: List the journeys in the job summary
        if: always()
        working-directory: packages/mobile
        run: |
          if [ -f e2e/journeys.json ]; then
            {
              echo '### Account journeys'
              echo
              echo '| Journey | Result |'
              echo '| --- | --- |'
              jq -r '.. | .specs? // empty | .[] | .title as $title | .tests[] | "| \($title)\(if .projectName == "phone" then "" else " (\(.projectName))" end) | \({expected: "passed", unexpected: "FAILED", flaky: "passed on retry", skipped: "skipped"}[.status] // .status) |"' e2e/journeys.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload videos, traces and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-e2e-artifacts
          path: |
            packages/mobile/e2e/results/
            packages/mobile/e2e/report/
            /tmp/pidro-backend.log
            /tmp/pidro-expo.log
            /tmp/pidro-web.log
          if-no-files-found: ignore
          retention-days: 14
